<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">

	<!--CSS読み込み-->
	<link rel="stylesheet" th:href="@{/css/tmapp.css}">
		
	<title>新規登録</title>
</head>
<body>
	<div class="form-signup">
		<form method="post" th:action="@{/signup}"  th:object="${signupForm}">
			<h6 class="text-center font-weight-bold mt-5">新規登録</h6>
			<!--ユーザー名-->
			<div class="mt-5 mb-3">	
				<label for="name" th:text="#{name}"></label>
				<input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid"/>
				<div class="invalid-feedback" th:errors="*{name}"></div>
			</div>
			<!--パスワード-->
			<div class="mb-3">	
				<label for="password" th:text="#{password}"></label>
				<input type="text" class="form-control" th:field="*{password}" th:errorclass="is-invalid"/>	
				<div class="invalid-feedback" th:errors="*{password}"></div>
			</div>
			<!--メールアドレス-->
			<div class="mb-3">	
				<label for="email" th:text="#{email}"></label>
				<input type="text" class="form-control" th:field="*{email}" th:errorclass="is-invalid"/>	
				<div class="invalid-feedback" th:errors="*{email}"></div>
			</div>
			
			<!--登録ボタン-->
			<input type="submit" value="新規登録" class="btn btn-outline-dark w-100 mt-3">
		</form>
		<!--戻るボタン-->
		<form method="post" th:action="@{#}">
			<input type="submit" value="戻る" class="btn btn-outline-danger w-100 mt-3">	
		</form>
	</div>
	
	<!-- BootStrap -->
	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>
</body>
</html>
